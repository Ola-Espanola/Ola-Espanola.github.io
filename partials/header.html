<script>
(() => {
  const root = document.documentElement;
  const phoneDesktop = window.matchMedia('(min-width: 901px) and (max-width: 1100px)');

  const syncPhoneDesktopClass = () => {
    root.classList.toggle('phone-desktop', phoneDesktop.matches);
  };

  syncPhoneDesktopClass();

  if (phoneDesktop.addEventListener) {
    phoneDesktop.addEventListener('change', syncPhoneDesktopClass);
  } else {
    phoneDesktop.addListener(syncPhoneDesktopClass);
  }
})();
</script>
