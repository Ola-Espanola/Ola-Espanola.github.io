<script>
(() => {
  const root = document.documentElement;
  const coarsePointer = window.matchMedia('(pointer: coarse)');
  const compactTouch = window.matchMedia('(min-width: 901px) and (max-width: 1100px) and (pointer: coarse)');

  const desktopScreenWidth = () => {
    const width = window.screen && window.screen.width ? window.screen.width : window.innerWidth;
    const available = window.screen && window.screen.availWidth ? window.screen.availWidth : width;
    return Math.min(width, available);
  };

  const syncCompactLayout = () => {
    const compactDesktop = !coarsePointer.matches && desktopScreenWidth() <= 1100;
    root.classList.toggle('compact-layout', compactDesktop || compactTouch.matches);
  };

  syncCompactLayout();

  if (compactTouch.addEventListener) {
    compactTouch.addEventListener('change', syncCompactLayout);
    coarsePointer.addEventListener('change', syncCompactLayout);
  } else {
    compactTouch.addListener(syncCompactLayout);
    coarsePointer.addListener(syncCompactLayout);
  }
})();
</script>
