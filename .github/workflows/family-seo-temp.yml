name: Family guide SEO review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-seo-temp.yml'

permissions:
  contents: write

jobs:
  update-family-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update family guide
        run: python scripts/family-seo-temp.py
      - name: Verify edits
        shell: bash
        run: |
          grep -q 'Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи' docs/family-member.html
          grep -q 'article:modified_time' docs/family-member.html
          grep -q 'Процентный лимит не установлен' docs/family-member.html
          ! grep -q '15% от требуемого дохода' docs/family-member.html
          grep -q 'Основной заявитель работает в найме' docs/family-member.html
          ! grep -q 'каждого familiar' docs/family-member.html
          grep -q 'с апостилем и присяжным переводом' docs/family-member.html
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/family-member.html content/family-member.md
          git commit -m "Polish family guide terminology"
          git push

# final wording cleanup
