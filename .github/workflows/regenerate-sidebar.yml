name: Regenerate sidebar

on:
  push:
    paths:
      - '.github/workflows/regenerate-sidebar.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate shared layout
        run: node scripts/update-layout.cjs
      - name: Verify generated layout
        run: node scripts/update-layout.cjs --check
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs blog
          git diff --cached --quiet && exit 0
          git commit -m "Apply shortened work record sidebar label"
          git push origin HEAD:main
