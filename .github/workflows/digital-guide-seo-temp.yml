name: Full guide SEO update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/digital-guide-seo-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix updater match
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/digital-guide-seo-temp.py')
          s=p.read_text(encoding='utf-8')
          old="('          <p>Если член семьи присоединяется позже, экономические средства титуляра подтверждаются заново.</p>',\n '          <p>Если член семьи присоединяется позже, экономические средства основного заявителя подтверждаются заново.</p>'),"
          new="('Если член семьи присоединяется позже, экономические средства титуляра подтверждаются заново.',\n 'Если член семьи присоединяется позже, экономические средства основного заявителя подтверждаются заново.'),"
          if old not in s:
              raise SystemExit('family replacement block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Update full guide
        run: python scripts/digital-guide-seo-temp.py
      - name: Verify
        shell: bash
        run: |
          grep -q 'Виза и ВНЖ цифрового кочевника в Испании: полный гайд 2026' docs/digital-nomad-spain-guide.html
          grep -q 'article:modified_time' docs/digital-nomad-spain-guide.html
          grep -q 'name="twitter:title"' docs/digital-nomad-spain-guide.html
          grep -q '"@type": "Article"' docs/digital-nomad-spain-guide.html
          grep -q 'class="seo-footer"' docs/digital-nomad-spain-guide.html
          grep -q 'простой перевод отдельно допускается для <strong>CV</strong>' docs/digital-nomad-spain-guide.html
          ! grep -q 'оказывает услуги иностранным клиентам' docs/digital-nomad-spain-guide.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/digital-nomad-spain-guide.html
          git commit -m "Improve full digital nomad guide SEO and wording"
          git push