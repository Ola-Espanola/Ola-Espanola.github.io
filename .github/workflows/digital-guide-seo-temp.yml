name: Full guide SEO update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/digital-guide-seo-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/digital-nomad-spain-guide.html')
          s=p.read_text(encoding='utf-8')
          changes=[
            ('Между собой должны сходиться договоры, инвойсы или акты, письма клиентов и банковские поступления.', 'Между собой должны сходиться договоры, инвойсы, письма клиентов и банковские поступления. Акты или аналогичные документы можно приложить дополнительно, если они используются в отношениях с клиентом.'),
            ('Для работы по контракту дополнительно важны инвойсы или акты и обязательство зарегистрироваться в испанской Seguridad Social как <code>autónomo</code> после одобрения.', 'Для работы по контракту дополнительно важны инвойсы и обязательство зарегистрироваться в испанской Seguridad Social как <code>autónomo</code> после одобрения. Акты или аналогичные документы можно приложить дополнительно, если они используются в отношениях с клиентом.'),
            ('Для российского документа нужен апостиль и <code>jurado</code> перевод.', 'Для российского документа нужен апостиль и присяжный перевод.'),
          ]
          for old,new in changes:
              if old not in s:
                  raise SystemExit('missing: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          ! grep -q 'инвойсы или акты' docs/digital-nomad-spain-guide.html
          ! grep -q '<code>jurado</code> перевод' docs/digital-nomad-spain-guide.html
          grep -q 'class="seo-footer"' docs/digital-nomad-spain-guide.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/digital-nomad-spain-guide.html
          git commit -m "Polish full digital nomad guide wording"
          git push