name: Update consulate text and contextual links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-consulate-links-sitemap.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update pages and sitemap
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ways = Path('docs/ways-to-apply.html')
          text = ways.read_text(encoding='utf-8')

          old_lead = '<p class="lead">Есть два пути: оформить визу цифрового кочевника через консульство до переезда или подать на ВНЖ номада, уже находясь в Испании законно. Основные требования к работе, доходу и документам одинаковые; различаются место подачи и срок первого разрешения.</p>'
          new_lead = old_lead + '\n        <p>Если вы работаете не по трудовому договору, а по контрактам с иностранными клиентами, список документов и пример пакета собраны в отдельном гайде <a href="contract-work.html">«Работа по контракту»</a>.</p>'
          if old_lead not in text:
              raise SystemExit('ways-to-apply lead paragraph not found')
          text = text.replace(old_lead, new_lead, 1)

          old_bullet = '<li>запись, формат пакета и порядок выдачи паспорта зависят от конкретного консульства;</li>'
          new_bullets = '''<li>на практике консульства могут проверять пакет строже: запрашивать дополнительные документы, уточнения или личное интервью; требования и подход к документам зависят от конкретного консульства;</li>
            <li>запись на подачу может быть сложнее, а ожидание свободного места зависит от конкретного консульства;</li>
            <li>формальный срок решения по визе составляет 10 дней, но весь процесс может занять больше времени из-за ожидания записи, запросов дополнительных документов или интервью и последующего получения паспорта;</li>'''
          if old_bullet not in text:
              raise SystemExit('ways-to-apply consulate bullet not found')
          text = text.replace(old_bullet, new_bullets, 1)
          ways.write_text(text, encoding='utf-8')

          contract = Path('docs/contract-work.html')
          text = contract.read_text(encoding='utf-8')
          old_contract_lead = '<p class="lead">Гайд по документам для подачи на ВНЖ цифрового кочевника в Испании при работе по контракту. Для заявителя из России, который оказывает услуги иностранным компаниям-клиентам по договорам. После одобрения заявитель регистрируется в Испании как работающий на себя: по-испански это autonomo.</p>'
          new_contract_lead = old_contract_lead + '\n        <p>Если вы еще выбираете между подачей через консульство и подачей из Испании, сравнение двух маршрутов есть в гайде <a href="ways-to-apply.html">«Способы получения»</a>.</p>'
          if old_contract_lead not in text:
              raise SystemExit('contract-work lead paragraph not found')
          text = text.replace(old_contract_lead, new_contract_lead, 1)
          contract.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          text = sitemap.read_text(encoding='utf-8')
          for url in [
              'https://ola-espanola.github.io/docs/ways-to-apply.html',
              'https://ola-espanola.github.io/docs/contract-work.html',
          ]:
              pattern = rf'(<loc>{re.escape(url)}</loc>\s*<lastmod>)[^<]+(</lastmod>)'
              text, n = re.subn(pattern, rf'\g<1>2026-09-16\g<2>', text, count=1)
              if n != 1:
                  raise SystemExit(f'sitemap entry not found for {url}')
          sitemap.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-consulate-links-sitemap.yml
          git add docs/ways-to-apply.html docs/contract-work.html sitemap.xml
          git commit -m "Update consulate drawbacks and contextual links"
          git push
