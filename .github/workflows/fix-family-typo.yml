name: Fix family typo

on:
  push:
    branches:
      - feat/seo-keyword-pages-work
    paths:
      - .github/workflows/fix-family-typo.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-keyword-pages-work
          fetch-depth: 0

      - name: Fix typo
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/family-member.html')
          text = path.read_text(encoding='utf-8')
          old = 'Для типиченой ситуации'
          new = 'Для типичной ситуации'
          if old not in text:
              raise SystemExit('Expected typo not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-family-typo.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/family-member.html .github/workflows/fix-family-typo.yml
          git commit -m "Fix typo in family member page"
          git push origin HEAD:feat/seo-keyword-pages-work
