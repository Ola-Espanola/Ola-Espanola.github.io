name: Clean criminal record Russian terms once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clean-criminal-record-russian-terms-once.yml"
      - "scripts/clean-criminal-record-russian-terms.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update page
        run: python scripts/clean-criminal-record-russian-terms.py

      - name: Verify rendered page terminology
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'Digital Nomad Visa|DNV|jurado|ВНЖ номада|residencia|estancia' docs/criminal-record-certificate.html
          ! grep -F '>titular<' docs/criminal-record-certificate.html
          grep -F 'Справка о несудимости для Испании: апостиль, перевод и Госуслуги' docs/criminal-record-certificate.html
          grep -F 'ВНЖ цифрового кочевника' docs/criminal-record-certificate.html
          grep -F 'присяжный перевод' docs/criminal-record-certificate.html

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/criminal-record-certificate.md docs/criminal-record-certificate.html
          git commit -m "Use Russian terminology on criminal record page"
          git push
