name: Apply wide mobile sidebar layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wide-mobile-sidebar.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add wide-mobile desktop-style sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/css/styles.css')
          s = p.read_text()
          marker = '@media (max-width: 360px) {'
          block = '''@media (min-width: 600px) and (max-width: 900px) {
            .layout {
              grid-template-columns: 220px minmax(0, 1fr);
              gap: 24px;
              padding: 28px 20px 52px;
            }

            .sidebar {
              position: sticky;
              top: 74px;
              z-index: 10;
              align-self: start;
              align-items: stretch;
              flex-direction: column;
              gap: 4px;
              margin: 0;
              padding: 16px;
              overflow: visible;
              border: 1px solid var(--line);
              border-radius: 8px;
              box-shadow: none;
            }

            .sidebar-title,
            .sidebar-section {
              display: block;
            }

            .sidebar-section {
              margin-top: 14px;
            }

            .sidebar a,
            .sidebar span {
              flex: initial;
              padding: 7px 9px;
              white-space: normal;
            }

            .sidebar .active {
              border: 0;
            }
          }

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          if block in s:
              raise SystemExit('Wide-mobile sidebar block already present')
          if marker not in s:
              raise SystemExit('Expected mobile marker not found')
          p.write_text(s.replace(marker, block + marker, 1))
          PY
      - name: Refresh asset versions and verify
        run: |
          node scripts/update-layout.cjs
          node scripts/update-layout.cjs --check
      - name: Commit result and remove temporary workflow
        run: |
          rm .github/workflows/apply-wide-mobile-sidebar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/styles.css index.html docs/*.html blog/*.html .github/workflows/apply-wide-mobile-sidebar.yml
          git commit -m "Use left sidebar on wide mobile screens"
          git push origin HEAD:main
