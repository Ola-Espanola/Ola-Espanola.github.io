name: Generate breadcrumb structured data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-layout.cjs'
      - '.github/workflows/generate-breadcrumbs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate pages
        run: node scripts/update-layout.cjs
      - name: Verify generated layout
        run: node scripts/update-layout.cjs --check
      - name: Commit generated HTML
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/*.html blog/*.html
          git commit -m "Add breadcrumb structured data"
          git push
