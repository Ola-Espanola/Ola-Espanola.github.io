name: Homepage SEO update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-seo-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update homepage SEO
        run: python scripts/home-seo-temp.py
      - name: Verify
        shell: bash
        run: |
          grep -q '<h1 style="margin: 0; flex: 1 1 320px;">Виза и ВНЖ цифрового кочевника в Испании</h1>' index.html
          grep -q 'name="twitter:title"' index.html
          grep -q 'class="seo-footer"' index.html
          grep -q 'полный список документов' index.html
          grep -q '<lastmod>2026-09-30</lastmod>' sitemap.xml
          ! grep -q 'работающего с иностранными клиентами' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml
          git commit -m "Improve homepage SEO and internal links"
          git push
