name: Sync shared layout

on:
  push:
    branches:
      - main
    paths:
      - "partials/**"
      - "assets/css/styles.css"
      - "assets/js/metrika.js"
      - "scripts/update-layout.cjs"
      - ".github/workflows/sync-layout.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-shared-layout
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render shared layout
        run: node scripts/update-layout.cjs

      - name: Verify generated layout
        run: node scripts/update-layout.cjs --check

      - name: Commit generated pages
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Shared layout already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/*.html blog/*.html
          git commit -m "Sync shared layout"
          git push
