name: Rebuild shared layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-shared-layout.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate shared layout
        run: node scripts/update-layout.cjs
      - name: Remove temporary sidebar JS backfill
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/js/metrika.js')
          s = p.read_text()
          start = s.find('// Keep already-generated pages in sync with the shared sidebar source.')
          end = s.find('// Google Analytics 4', start)
          if start != -1 and end != -1:
              s = s[:start] + s[end:]
              p.write_text(s)
          PY
      - name: Check generated layout
        run: node scripts/update-layout.cjs --check
      - name: Commit generated files and remove temporary workflow
        run: |
          rm .github/workflows/rebuild-shared-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs blog assets/js/metrika.js .github/workflows/rebuild-shared-layout.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate shared layout"
          git push origin HEAD:main
