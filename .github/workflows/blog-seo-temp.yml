name: Blog SEO update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blog-seo-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update blog SEO
        run: python scripts/blog-seo-temp.py
      - name: Verify
        shell: bash
        run: |
          for f in blog/nalogi-cifrovogo-kochevnika-ispania.html blog/statistika-nomadov-ispania.html; do
            grep -q 'article:modified_time' "$f"
            grep -q 'name="twitter:title"' "$f"
            grep -q '"@type": "Article"' "$f"
            grep -q 'class="seo-footer"' "$f"
          done
          grep -q '"@type": "CollectionPage"' blog/index.html
          grep -q 'name="twitter:title"' blog/index.html
          grep -q 'class="seo-footer"' blog/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/*.html
          git commit -m "Improve blog SEO metadata and footers"
          git push