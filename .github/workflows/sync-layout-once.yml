name: Sync shared layout once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-layout-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render shared layout
        run: node scripts/update-layout.cjs

      - name: Commit generated HTML
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Shared layout is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/*.html blog/*.html
          git commit -m "Sync shared navigation"
          git push
