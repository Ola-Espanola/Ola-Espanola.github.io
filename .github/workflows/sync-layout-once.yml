name: Sync shared layout once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-layout-once.yml"

permissions:
  contents: write

jobs:
  sync-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate shared layout
        run: node scripts/update-layout.cjs

      - name: Commit generated HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/*.html blog/*.html
          if git diff --cached --quiet; then
            echo "No generated layout changes."
            exit 0
          fi
          git commit -m "Regenerate shared layout"
          git push
