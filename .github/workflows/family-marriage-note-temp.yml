name: Family marriage note update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-marriage-note-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update marriage certificate recommendation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/family-member.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>В актуальной памятке UGE <strong>срок давности свидетельства о браке не установлен</strong>. Документ должен подтверждать семейную связь на дату подачи.</p>'
          new = '<p>Точный срок давности свидетельства о браке UGE не устанавливает. Но на практике слишком старый документ может вызвать вопросы или дозапрос, поэтому <strong>рекомендуем по возможности подавать свидетельство, выданное не более 6 месяцев назад</strong>. Шесть месяцев — практический ориентир, а не официальный срок действия документа.</p>'
          if old not in s:
              raise SystemExit('Expected marriage paragraph not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'Шесть месяцев — практический ориентир, а не официальный срок действия документа' docs/family-member.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/family-member.html
          git commit -m "Clarify marriage certificate freshness guidance"
          git push
