name: Fix cuenta ajena test package layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cuenta-ajena-package-test.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make package section compact
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Doc/cuenta-ajena-test.html')
          html = p.read_text(encoding='utf-8')

          new = '''        <section>
          <h2>Пример состава пакета для подачи</h2>
          <p>Пример названий файлов для подачи по найму. Файлы 01–13 идут в порядке полей формы UGE; остальные загружаются в раздел дополнительных документов.</p>
          <ol>
            <li><strong>01_Certificado_cobertura_Seguridad_Social.pdf</strong> — свидетельство СФР об отъезде или другое подтверждение применимого социального страхования.</li>
            <li><strong>02_Pasaporte.pdf</strong> — полный загранпаспорт, все страницы.</li>
            <li><strong>03_Tasa_790_038.pdf</strong> — tasa 790, код 038, и подтверждение оплаты.</li>
            <li><strong>04_Formulario_MIT.pdf</strong> — заполненное и подписанное заявление MIT.</li>
            <li><strong>05_Contrato_laboral.pdf</strong> — трудовой договор и, при необходимости, дополнительное соглашение об удалённой работе из Испании.</li>
            <li><strong>06_Certificado_bancario_ultimos_3_meses.pdf</strong> — банковская выписка или сертификат с поступлениями зарплаты за последние 3 месяца.</li>
            <li><strong>07_Certificado_registro_empresa.pdf</strong> — документ о регистрации работодателя; для российского юрлица обычно выписка из ЕГРЮЛ.</li>
            <li><strong>08_Carta_empresa.pdf</strong> — письмо работодателя с разрешением работать удалённо из Испании.</li>
            <li><strong>09_Titulo_o_experiencia.pdf</strong> — диплом либо документы, подтверждающие профессиональный опыт.</li>
            <li><strong>10_CV.pdf</strong> — CV заявителя на испанском.</li>
            <li><strong>11_Seguro_medico.pdf</strong> — сертификат медицинской страховки.</li>
            <li><strong>12_Certificado_antecedentes_penales.pdf</strong> — справка о несудимости, если она требуется.</li>
            <li><strong>13_Declaracion_responsable_antecedentes.pdf</strong> — declaración responsable об отсутствии судимости за последние 5 лет.</li>
          </ol>

          <h3>Дополнительные документы</h3>
          <ul>
            <li><strong>Carta_explicativa.pdf</strong> — сопроводительное письмо.</li>
            <li><strong>Nominas_ultimos_3_meses.pdf</strong> — зарплатные листы за последние 3 месяца.</li>
            <li><strong>Estancia_regular_en_Espana.pdf</strong> — подтверждение легального нахождения в Испании.</li>
            <li><strong>Representacion.pdf</strong> — Designación de representante, если заявление подаёт представитель.</li>
          </ul>
        </section>

'''

          pattern = re.compile(r'        <section>\n          <h2>Пример состава пакета для подачи</h2>.*?(?=        <section id="medical-insurance">)', re.S)
          html, n = pattern.subn(new, html, count=1)
          if n != 1:
              raise SystemExit('Package section not found')
          p.write_text(html, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Doc/cuenta-ajena-test.html
          git commit -m "Make cuenta ajena test package list compact"
          git push
