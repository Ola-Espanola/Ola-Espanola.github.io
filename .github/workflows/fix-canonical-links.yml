name: Fix canonical internal links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html links with canonical URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              old = s

              # Links to the site homepage should use the canonical root URL.
              s = s.replace('href="../index.html"', 'href="/"')
              s = s.replace("href='../index.html'", "href='/'")
              s = s.replace('href="/index.html"', 'href="/"')
              s = s.replace("href='/index.html'", "href='/'")

              # Links to the blog index should use its canonical directory URL.
              s = s.replace('href="../blog/index.html"', 'href="/blog/"')
              s = s.replace("href='../blog/index.html'", "href='/blog/'")
              s = s.replace('href="/blog/index.html"', 'href="/blog/"')
              s = s.replace("href='/blog/index.html'", "href='/blog/'")
              s = s.replace('href="blog/index.html"', 'href="/blog/"')
              s = s.replace("href='blog/index.html'", "href='/blog/'")

              # A bare index.html means the current directory index.
              if p.as_posix() == 'index.html':
                  s = s.replace('href="index.html"', 'href="/"')
                  s = s.replace("href='index.html'", "href='/'")
              elif p.parts and p.parts[0] == 'blog':
                  s = s.replace('href="index.html"', 'href="/blog/"')
                  s = s.replace("href='index.html'", "href='/blog/'")

              if s != old:
                  p.write_text(s, encoding='utf-8')

          # This workflow is intentionally one-shot; remove it in the same commit.
          Path('.github/workflows/fix-canonical-links.yml').unlink(missing_ok=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Use canonical URLs for homepage and blog links"
          git push origin HEAD:main
