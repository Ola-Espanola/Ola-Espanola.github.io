name: Update criminal and sworn SEO once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-criminal-sworn-seo-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update SEO pages
        run: python scripts/update-criminal-sworn-seo.py

      - name: Render shared layout
        run: node scripts/update-layout.cjs

      - name: Verify generated layout
        run: node scripts/update-layout.cjs --check

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/criminal-record-certificate.md docs/criminal-record-certificate.html docs/sworn-translation.html partials/sidebar.html sitemap.xml index.html docs/*.html blog/*.html
          git commit -m "Improve criminal record and sworn translation SEO"
          git push
