name: Regenerate sidebar once

on:
  push:
    branches:
      - main
    paths:
      - "partials/sidebar.html"
      - ".github/workflows/regenerate-sidebar-once.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate shared layout
        run: node scripts/update-layout.cjs

      - name: Verify generated layout
        run: node scripts/update-layout.cjs --check

      - name: Commit generated HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/*.html blog/*.html
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Regenerate sidebar layout"
          git push
