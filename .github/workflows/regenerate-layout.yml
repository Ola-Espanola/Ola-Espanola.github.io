name: Regenerate shared layout

on:
  push:
    branches: [main]
    paths:
      - 'partials/sidebar.html'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate layout
        run: node scripts/update-layout.cjs
      - name: Commit generated pages
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs blog
          git commit -m "Regenerate shared layout"
          git push
