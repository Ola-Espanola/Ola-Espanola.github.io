name: Promote index2 to homepage once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote-index2-once.yml"

permissions:
  contents: write

jobs:
  promote-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Promote approved draft
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          main_path = Path('index.html')
          draft_path = Path('index2.html')
          sitemap_path = Path('sitemap.xml')

          main = main_path.read_text(encoding='utf-8')
          draft = draft_path.read_text(encoding='utf-8')

          def shared_block(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              return text[start:end]

          header = shared_block(main, '    <!-- shared:header -->', '    <!-- /shared:header -->')
          sidebar = shared_block(main, '      <!-- shared:sidebar guide -->', '      <!-- /shared:sidebar -->')

          # The draft was intentionally noindex while it was being reviewed.
          draft = draft.replace('    <meta name="robots" content="noindex, nofollow">\n', '')

          draft, n = re.subn(
              r'    <header class="site-header">[\s\S]*?    </header>',
              lambda _: header,
              draft,
              count=1,
          )
          if n != 1:
              raise SystemExit('Draft header not found')

          draft, n = re.subn(
              r'      <style>[\s\S]*?      </aside>',
              lambda _: sidebar,
              draft,
              count=1,
          )
          if n != 1:
              raise SystemExit('Draft sidebar not found')

          main_path.write_text(draft, encoding='utf-8')

          sitemap = sitemap_path.read_text(encoding='utf-8')
          old = '    <loc>https://ola-espanola.github.io/</loc>\n    <lastmod>2026-09-23</lastmod>'
          new = '    <loc>https://ola-espanola.github.io/</loc>\n    <lastmod>2026-09-29</lastmod>'
          if old not in sitemap:
              raise SystemExit('Homepage sitemap entry not found')
          sitemap_path.write_text(sitemap.replace(old, new, 1), encoding='utf-8')

          draft_path.unlink()
          PY

      - name: Validate shared layout
        shell: bash
        run: node scripts/update-layout.cjs --check

      - name: Commit homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml index2.html
          git commit -m "Publish optimized homepage and remove draft"
          git push
