name: Update News metadata once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-news-meta-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace News metadata title
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          old = "Новости Digital Nomad Visa Spain: практика UGE и продление ВНЖ 2026"
          new = "Новости ВНЖ цифрового кочевника в Испании — практика UGE 2026"
          expected = {
              Path("content/news.md"): 1,
              Path("docs/news.html"): 3,
          }

          for path, count_expected in expected.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != count_expected:
                  raise SystemExit(f"{path}: expected {count_expected} title occurrences, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/news.md docs/news.html
          git commit -m "Improve News page metadata title"
          git push
