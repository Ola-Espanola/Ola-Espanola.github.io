name: Promote pricing SEO update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-pricing-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update pricing page
        run: |
          echo '' | base64 -d > /tmp/update_pricing.py
          python /tmp/update_pricing.py
      - name: Regenerate shared layout
        run: node scripts/update-layout.cjs
      - name: Verify generated layout
        run: node scripts/update-layout.cjs --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pricing.html sitemap.xml Doc/cloudflare-site/sitemap.xml
          git add -u Doc/pricing-test.html || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Publish optimized pricing page"
          git push
