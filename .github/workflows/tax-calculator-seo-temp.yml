name: Tax calculator SEO update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tax-calculator-seo-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update calculator SEO
        run: python scripts/tax-calculator-seo-temp.py
      - name: Verify
        shell: bash
        run: |
          grep -q 'Калькулятор налогов цифрового кочевника в Испании — 2026' docs/tax-calculator.html
          grep -q 'property="og:title"' docs/tax-calculator.html
          grep -q 'name="twitter:title"' docs/tax-calculator.html
          grep -q '"@type": "WebApplication"' docs/tax-calculator.html
          grep -q 'class="seo-footer"' docs/tax-calculator.html
          grep -q '<lastmod>2026-09-30</lastmod>' sitemap.xml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tax-calculator.html sitemap.xml
          git commit -m "Improve tax calculator SEO metadata and footer"
          git push
