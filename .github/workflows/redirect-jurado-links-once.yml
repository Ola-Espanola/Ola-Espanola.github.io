name: Redirect jurado links once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/redirect-jurado-links-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish jurado redirects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          md = Path('content/document-requirements.md')
          s = md.read_text()
          s = s.replace(
              'Официальный список переводчиков есть на сайте МИД Испании. Ссылка на поиск лежит в разделе [Полезные ссылки](../docs/sworn-translation.html). В поиске можно выбрать язык, страну/провинцию и тип специалиста. В карточках переводчиков обычно есть контакты, поэтому практичный способ - взять несколько email из списка и разослать один запрос с документом, языковой парой, сроком и просьбой назвать цену.',
              'Официальный список переводчиков есть на сайте МИД Испании. Как найти переводчика, проверить его в реестре и запросить стоимость, описано в отдельном гайде [Хурадо-перевод](../docs/sworn-translation.html).'
          )
          md.write_text(s)

          html = Path('docs/document-requirements.html')
          s = html.read_text()
          s = s.replace(
              'Официальный список переводчиков есть на сайте МИД Испании. Ссылка на поиск лежит в разделе <a href="sworn-translation.html">Полезные ссылки</a>. В поиске можно выбрать язык, страну/провинцию и тип специалиста. В карточках переводчиков обычно есть контакты, поэтому практичный способ - взять несколько email из списка и разослать один запрос с документом, языковой парой, сроком и просьбой назвать цену.',
              'Официальный список переводчиков есть на сайте МИД Испании. Как найти переводчика, проверить его в реестре и запросить стоимость, описано в отдельном гайде <a href="sworn-translation.html">Хурадо-перевод</a>.'
          )
          html.write_text(s)
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/document-requirements.md docs/document-requirements.html
          git commit -m "Polish jurado guide redirect text"
          git push
