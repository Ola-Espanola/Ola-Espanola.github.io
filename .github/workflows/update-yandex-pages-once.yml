name: Update Yandex pages once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-yandex-pages-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update pages
        run: python scripts/update-yandex-pages-once.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/nalogi-cifrovogo-kochevnika-ispania.md blog/nalogi-cifrovogo-kochevnika-ispania.html content/family-member.md docs/family-member.html sitemap.xml
          git commit -m "Improve tax article tables and family SEO"
          git push
