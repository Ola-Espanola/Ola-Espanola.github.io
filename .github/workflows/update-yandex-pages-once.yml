name: Update Yandex pages once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-yandex-pages-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve tax article and family page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return text.replace(old, new, 1)

          # --- Tax article source Markdown ---
          p = Path("content/nalogi-cifrovogo-kochevnika-ispania.md")
          text = p.read_text(encoding="utf-8")
          anchor = "Одни только ставки налогов мало что говорят. Для переезда важнее другой вопрос: сколько денег реально остается после налогов, соцстраха и обязательных расходов. Поэтому ниже сравниваются несколько типовых вариантов для цифрового кочевника в Испании."
          note = anchor + "\n\n**Как читать таблицы:** ниже приведен ориентировочный расчет для одного заявителя без детей в Comunitat Valenciana в 2026 году. Суммы округлены до евро; для своего состава семьи и региона используйте [налоговый калькулятор](../docs/tax-calculator.html)."
          text = replace_once(text, anchor, note, "tax md note")

          table_autonomo = """| Доход в месяц | IRPF в месяц | Seguridad Social | Остается в месяц | Общая нагрузка |
          |---:|---:|---:|---:|---:|
          | 3 000 € | 476 € | 427 € | 2 097 € | 30,1% |
          | 4 000 € | 777 € | 479 € | 2 744 € | 31,4% |
          | 5 000 € | 1 127 € | 546 € | 3 327 € | 33,5% |
          | 7 000 € | 1 988 € | 607 € | 4 404 € | 37,1% |
          | 10 000 € | 3 458 € | 607 € | 5 935 € | 40,6% |"""
          text = replace_once(text, "![Таблица налогов autónomo без стартовых льгот](../assets/images/blog/1_autonomo_table.png)", table_autonomo, "tax md autonomo table")

          table_benefit = """| Доход в месяц | IRPF в месяц | Льготная cuota | Остается в месяц | Общая нагрузка |
          |---:|---:|---:|---:|---:|
          | 3 000 € | 408 € | 89 € | 2 504 € | 16,5% |
          | 4 000 € | 650 € | 89 € | 3 262 € | 18,5% |
          | 5 000 € | 941 € | 89 € | 3 971 € | 20,6% |
          | 7 000 € | 1 595 € | 89 € | 5 316 € | 24,1% |
          | 10 000 € | 2 888 € | 89 € | 7 023 € | 29,8% |"""
          text = replace_once(text, "![Таблица налогов autónomo со стартовыми льготами](../assets/images/blog/3_autonomo_table_benefits.png)", table_benefit, "tax md benefit table")

          table_employee = """| Доход в месяц | IRPF в месяц | Испанские соцвзносы | Остается в месяц | Общая нагрузка |
          |---:|---:|---:|---:|---:|
          | 3 000 € | 595 € | 0 € | 2 405 € | 19,8% |
          | 4 000 € | 955 € | 0 € | 3 045 € | 23,9% |
          | 5 000 € | 1 346 € | 0 € | 3 654 € | 26,9% |
          | 7 000 € | 2 284 € | 0 € | 4 716 € | 32,6% |
          | 10 000 € | 3 760 € | 0 € | 6 240 € | 37,6% |"""
          text = replace_once(text, "![Таблица налогов при работе по найму](../assets/images/blog/5_ajena_table.png)", table_employee, "tax md employee table")
          p.write_text(text, encoding="utf-8")

          # --- Tax article rendered HTML ---
          p = Path("blog/nalogi-cifrovogo-kochevnika-ispania.html")
          text = p.read_text(encoding="utf-8")
          html_anchor = "<p>Одни только ставки налогов мало что говорят. Для переезда важнее другой вопрос: сколько денег реально остается после налогов, соцстраха и обязательных расходов. Поэтому ниже сравниваются несколько типовых вариантов для цифрового кочевника в Испании.</p>"
          html_note = html_anchor + "\n\n        <p><strong>Как читать таблицы:</strong> ниже приведен ориентировочный расчет для одного заявителя без детей в Comunitat Valenciana в 2026 году. Суммы округлены до евро; для своего состава семьи и региона используйте <a href=\"../docs/tax-calculator.html\">налоговый калькулятор</a>.</p>"
          text = replace_once(text, html_anchor, html_note, "tax html note")

          def html_table(headers, rows):
              head = ''.join(f'<th>{h}</th>' for h in headers)
              body = '\n'.join('                <tr>' + ''.join(f'<td>{v}</td>' for v in row) + '</tr>' for row in rows)
              return f'''<div class="table-wrap">
            <table>
              <thead><tr>{head}</tr></thead>
              <tbody>
{body}
              </tbody>
            </table>
          </div>'''

          auto_html = html_table(
              ["Доход в месяц", "IRPF в месяц", "Seguridad Social", "Остается в месяц", "Общая нагрузка"],
              [["3 000 €","476 €","427 €","2 097 €","30,1%"],["4 000 €","777 €","479 €","2 744 €","31,4%"],["5 000 €","1 127 €","546 €","3 327 €","33,5%"],["7 000 €","1 988 €","607 €","4 404 €","37,1%"],["10 000 €","3 458 €","607 €","5 935 €","40,6%"]]
          )
          benefit_html = html_table(
              ["Доход в месяц", "IRPF в месяц", "Льготная cuota", "Остается в месяц", "Общая нагрузка"],
              [["3 000 €","408 €","89 €","2 504 €","16,5%"],["4 000 €","650 €","89 €","3 262 €","18,5%"],["5 000 €","941 €","89 €","3 971 €","20,6%"],["7 000 €","1 595 €","89 €","5 316 €","24,1%"],["10 000 €","2 888 €","89 €","7 023 €","29,8%"]]
          )
          employee_html = html_table(
              ["Доход в месяц", "IRPF в месяц", "Испанские соцвзносы", "Остается в месяц", "Общая нагрузка"],
              [["3 000 €","595 €","0 €","2 405 €","19,8%"],["4 000 €","955 €","0 €","3 045 €","23,9%"],["5 000 €","1 346 €","0 €","3 654 €","26,9%"],["7 000 €","2 284 €","0 €","4 716 €","32,6%"],["10 000 €","3 760 €","0 €","6 240 €","37,6%"]]
          )

          patterns = [
              (r'<figure class="article-hero">\s*<img src="\.\./assets/images/blog/1_autonomo_table\.png" alt="Таблица налогов autónomo без стартовых льгот">\s*</figure>', auto_html, "tax html autonomo table"),
              (r'<figure class="article-hero">\s*<img src="\.\./assets/images/blog/3_autonomo_table_benefits\.png" alt="Таблица налогов autónomo со стартовыми льготами">\s*</figure>', benefit_html, "tax html benefit table"),
              (r'<figure class="article-hero">\s*<img src="\.\./assets/images/blog/5_ajena_table\.png" alt="Таблица налогов при работе по найму">\s*</figure>', employee_html, "tax html employee table"),
          ]
          for pattern, replacement, label in patterns:
              text, n = re.subn(pattern, replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
          text = text.replace('<meta property="article:modified_time" content="2026-09-30">', '<meta property="article:modified_time" content="2026-10-05">', 1)
          text = text.replace('"dateModified": "2026-09-30"', '"dateModified": "2026-10-05"', 1)
          p.write_text(text, encoding="utf-8")

          # --- Family source Markdown ---
          p = Path("content/family-member.md")
          text = p.read_text(encoding="utf-8")
          replacements = [
              ('title: "Полный список документов для визы и ВНЖ номада в Испании — член семьи"', 'title: "Семья цифрового кочевника в Испании: супруг, дети и документы"'),
              ('description: "Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи: супруг, партнер, дети, MI-F, доход, страховка и несудимость."', 'description: "ВНЖ для семьи цифрового кочевника в Испании: документы для супруга, партнера и детей, Formulario MI-F, доход, страховка, несудимость и подача в UGE."'),
              ('# Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи', '# ВНЖ для членов семьи цифрового кочевника в Испании'),
              ('Полный список документов для визы и ВНЖ цифрового кочевника в Испании для **супруга, партнера, ребенка и других членов семьи** основного заявителя.', 'Как оформить ВНЖ **супругу, партнеру, детям и другим членам семьи цифрового кочевника в Испании**: кто может подаваться, какие документы нужны и как устроена отдельная подача в UGE.')
          ]
          for old, new in replacements:
              text = replace_once(text, old, new, f"family md {old[:30]}")
          p.write_text(text, encoding="utf-8")

          # --- Family rendered HTML ---
          p = Path("docs/family-member.html")
          text = p.read_text(encoding="utf-8")
          html_replacements = [
              ('<title>Полный список документов для визы и ВНЖ номада в Испании — член семьи | Ola Española</title>', '<title>Семья цифрового кочевника в Испании: супруг, дети и документы | Ola Española</title>'),
              ('<meta name="description" content="Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи: супруг, партнер, дети, MI-F, доход, страховка и несудимость.">', '<meta name="description" content="ВНЖ для семьи цифрового кочевника в Испании: документы для супруга, партнера и детей, Formulario MI-F, доход, страховка, несудимость и подача в UGE.">'),
              ('<meta property="og:title" content="Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи">', '<meta property="og:title" content="Семья цифрового кочевника в Испании: супруг, дети и документы">'),
              ('<meta property="og:description" content="Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи: супруг, партнер, дети, MI-F, доход, страховка и несудимость.">', '<meta property="og:description" content="ВНЖ для семьи цифрового кочевника в Испании: документы для супруга, партнера и детей, Formulario MI-F, доход, страховка, несудимость и подача в UGE.">'),
              ('<meta property="article:modified_time" content="2026-09-30">', '<meta property="article:modified_time" content="2026-10-05">'),
              ('<meta name="twitter:title" content="Полный список документов для визы и ВНЖ номада — член семьи">', '<meta name="twitter:title" content="Семья цифрового кочевника в Испании: супруг, дети и документы">'),
              ('<meta name="twitter:description" content="Документы для супруга, партнера, детей и других членов семьи цифрового кочевника в Испании: MI-F, родство, доход, страховка и несудимость.">', '<meta name="twitter:description" content="ВНЖ для супруга, партнера и детей цифрового кочевника в Испании: документы, MI-F, доход, страховка, несудимость и подача в UGE.">'),
              ('"headline": "Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи"', '"headline": "ВНЖ для членов семьи цифрового кочевника в Испании"'),
              ('"description": "Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи: супруг, партнер, дети, MI-F, доход, страховка и несудимость."', '"description": "ВНЖ для семьи цифрового кочевника в Испании: документы для супруга, партнера и детей, Formulario MI-F, доход, страховка, несудимость и подача в UGE."'),
              ('"dateModified": "2026-09-30"', '"dateModified": "2026-10-05"'),
              ('"name": "Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи"', '"name": "Семья цифрового кочевника в Испании"'),
              ('<h1>Полный список документов для визы и ВНЖ цифрового кочевника в Испании для члена семьи</h1>', '<h1>ВНЖ для членов семьи цифрового кочевника в Испании</h1>'),
              ('<p class="lead">Полный список документов для визы и ВНЖ цифрового кочевника в Испании для <strong>супруга, партнера, ребенка и других членов семьи</strong> основного заявителя.</p>', '<p class="lead">Как оформить ВНЖ <strong>супругу, партнеру, детям и другим членам семьи цифрового кочевника в Испании</strong>: кто может подаваться, какие документы нужны и как устроена отдельная подача в UGE.</p>')
          ]
          for old, new in html_replacements:
              text = replace_once(text, old, new, f"family html {old[:30]}")
          p.write_text(text, encoding="utf-8")

          # --- Sitemap lastmod for changed pages ---
          p = Path("sitemap.xml")
          text = p.read_text(encoding="utf-8")
          for url in [
              "https://ola-espanola.github.io/docs/family-member.html",
              "https://ola-espanola.github.io/blog/nalogi-cifrovogo-kochevnika-ispania.html",
          ]:
              pattern = rf'(<loc>{re.escape(url)}</loc>\s*<lastmod>)[^<]+(</lastmod>)'
              text, n = re.subn(pattern, rf'\g<1>2026-10-05\g<2>', text, count=1)
              if n != 1:
                  raise SystemExit(f"sitemap: did not update {url}")
          p.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/nalogi-cifrovogo-kochevnika-ispania.md blog/nalogi-cifrovogo-kochevnika-ispania.html content/family-member.md docs/family-member.html sitemap.xml
          git commit -m "Improve tax article tables and family SEO"
          git push
