name: Header logo update

on:
  push:
    paths:
      - '.github/workflows/header-logo.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace brand O with logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), *sorted(Path('docs').glob('*.html')), *sorted(Path('blog').glob('*.html'))]
          pattern = re.compile(r'<a class="brand" href="([^"]+)"><img class="brand-mark" src="([^"]*?)site-symbol\.png" alt=""><span>Ola Española</span></a>')
          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              new, n = pattern.subn(lambda m: f'<a class="brand" href="{m.group(1)}"><img class="brand-mark" src="{m.group(2)}ola-espanola2.png" alt="O"><span>la Española</span></a>', text)
              if n:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          if changed < 20:
              raise SystemExit(f'Unexpectedly few HTML files changed: {changed}')

          css = Path('assets/css/styles.css')
          text = css.read_text(encoding='utf-8')
          old_brand = '''.brand {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  color: var(--nav);\n  font-size: 20px;\n  font-weight: 700;\n  text-decoration: none;\n  white-space: nowrap;\n  flex-shrink: 0;\n}\n\n.brand-mark {\n  width: 51px;\n  height: 51px;\n  border: 1px solid rgba(24, 54, 66, 0.18);\n  border-radius: 50%;\n  object-fit: cover;\n}\n'''
          new_brand = '''.brand {\n  display: inline-flex;\n  align-items: center;\n  gap: 1px;\n  color: var(--nav);\n  font-size: 20px;\n  font-weight: 700;\n  text-decoration: none;\n  white-space: nowrap;\n  flex-shrink: 0;\n}\n\n.brand-mark {\n  width: 1.2em;\n  height: 1.2em;\n  flex: 0 0 1.2em;\n  border: 0;\n  border-radius: 0;\n  object-fit: contain;\n}\n'''
          if old_brand not in text:
              raise SystemExit('Expected brand CSS block not found')
          css.write_text(text.replace(old_brand, new_brand, 1), encoding='utf-8')

          print(f'Updated header in {changed} HTML files')
          PY
      - name: Commit changes
        run: |
          git config user.name "alexey-s-potapov"
          git config user.email "103932994+alexey-s-potapov@users.noreply.github.com"
          git add index.html docs blog assets/css/styles.css
          git commit -m "Заменить букву O в названии сайта на логотип"
          git push
