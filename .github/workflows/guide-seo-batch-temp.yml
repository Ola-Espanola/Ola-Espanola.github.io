name: Guide SEO batch update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guide-seo-batch-temp.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update guide SEO
        run: python scripts/guide-seo-batch-temp.py
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ['eligibility.html','ways-to-apply.html','formulario-mit.html','client-contracts.html','bank-statement.html','company-registration.html','client-letter.html','electronic-work-record.html','diploma-apostille.html','cv.html','criminal-record-certificate.html','social-security-certificate.html','legal-stay-in-spain.html','document-requirements.html','sworn-translation.html','uge-instruction-summary.html','uge-conference-update.html','links.html']
          for f in pages:
              s=Path('docs',f).read_text(encoding='utf-8')
              assert 'article:modified_time' in s, f
              assert 'name="twitter:title"' in s and 'name="twitter:description"' in s, f
              assert '"@type": "Article"' in s, f
              assert 'class="seo-footer"' in s, f
          print('Verified', len(pages), 'pages')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.html
          git commit -m "Improve guide SEO metadata and footers"
          git push
