name: Add tax graph captions once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/add-tax-graph-captions-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update captions
        run: python scripts/add-tax-graph-captions.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/nalogi-cifrovogo-kochevnika-ispania.md blog/nalogi-cifrovogo-kochevnika-ispania.html
          git commit -m "Add captions to tax graphs"
          git push
