name: Apply focused SEO keyword updates

on:
  push:
    branches:
      - feat/seo-keyword-pages
    paths:
      - scripts/apply-seo-keywords.py
      - .github/workflows/apply-seo-keywords.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-keyword-pages
          fetch-depth: 0

      - name: Apply SEO keyword changes
        run: python scripts/apply-seo-keywords.py

      - name: Remove temporary updater
        run: |
          rm scripts/apply-seo-keywords.py
          rm .github/workflows/apply-seo-keywords.yml

      - name: Commit focused SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/eligibility.html docs/ways-to-apply.html docs/family-member.html docs/tax-calculator.html scripts/apply-seo-keywords.py .github/workflows/apply-seo-keywords.yml
          git commit -m "Optimize existing pages for SEO keywords"
          git push origin HEAD:feat/seo-keyword-pages
