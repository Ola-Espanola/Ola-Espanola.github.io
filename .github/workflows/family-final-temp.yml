name: Final family guide cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/family-final-temp.yml'

permissions:
  contents: write

jobs:
  update-family-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final cleanup
        run: python scripts/family-final-temp.py
      - name: Verify
        shell: bash
        run: |
          grep -q 'Возраст <strong>ровно 26 лет</strong>' docs/family-member.html
          grep -q 'работающего как autónomo' docs/family-member.html
          grep -q 'Страница опубликована как' content/family-member.md
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/family-member.html content/family-member.md
          git commit -m "Clarify family guide edge cases"
          git push
