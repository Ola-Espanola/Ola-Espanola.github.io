name: Reorder index2 sections once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reorder-index2-once.yml"

permissions:
  contents: write

jobs:
  reorder-index2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move documents section first
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index2.html')
          text = path.read_text(encoding='utf-8')

          def find_section(title):
              pattern = re.compile(r'        <section>\n          <h2>' + re.escape(title) + r'</h2>[\s\S]*?\n        </section>')
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'Section not found: {title}')
              return match.group(0)

          docs = find_section('Что нужно для подачи')
          audience = find_section('Кому подходит ВНЖ цифрового кочевника')

          if text.index(docs) < text.index(audience):
              raise SystemExit('Documents section is already before audience section')

          text = text.replace(docs + '\n\n', '', 1)
          text = text.replace(audience, docs + '\n\n' + audience, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index2.html
          git commit -m "Move application documents first on index2"
          git push
