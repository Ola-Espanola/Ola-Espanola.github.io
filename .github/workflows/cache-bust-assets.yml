name: Apply asset cache busting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-assets.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add automatic asset versioning to layout generator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/update-layout.cjs')
          text = path.read_text()

          old_imports = "const fs = require('node:fs');\nconst path = require('node:path');\nconst root = path.resolve(__dirname, '..');"
          new_imports = "const fs = require('node:fs');\nconst path = require('node:path');\nconst crypto = require('node:crypto');\nconst root = path.resolve(__dirname, '..');\n\nconst ASSET_VERSION = crypto.createHash('sha256')\n  .update(fs.readFileSync(path.join(root, 'assets/css/styles.css')))\n  .update(fs.readFileSync(path.join(root, 'assets/js/metrika.js')))\n  .digest('hex')\n  .slice(0, 10);"
          if old_imports not in text:
              raise SystemExit('Expected import block not found')
          text = text.replace(old_imports, new_imports, 1)

          marker = "function updatePage(source, page) {"
          helper = r'''function versionAssets(html) {
  return html
    .replace(/((?:\/|(?:\.\.\/)*)assets\/css\/styles\.css)(?:\?v=[^"'\s>]*)?/g, `$1?v=${ASSET_VERSION}`)
    .replace(/((?:\/|(?:\.\.\/)*)assets\/js\/metrika\.js)(?:\?v=[^"'\s>]*)?/g, `$1?v=${ASSET_VERSION}`);
}

'''
          if marker not in text:
              raise SystemExit('updatePage marker not found')
          text = text.replace(marker, helper + marker, 1)

          old_return = "  return result.replace(/\\n/g, eol);"
          new_return = "  return versionAssets(result).replace(/\\n/g, eol);"
          if old_return not in text:
              raise SystemExit('Expected updatePage return not found')
          text = text.replace(old_return, new_return, 1)

          path.write_text(text)
          PY

      - name: Regenerate HTML and verify
        run: |
          node scripts/update-layout.cjs
          node scripts/update-layout.cjs --check

      - name: Commit generated cache-busted HTML
        run: |
          rm .github/workflows/cache-bust-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update-layout.cjs index.html docs/*.html blog/*.html .github/workflows/cache-bust-assets.yml
          git commit -m "Add automatic asset cache busting"
          git push
