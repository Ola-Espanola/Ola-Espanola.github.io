name: Update shared layout

on:
  push:
    branches: [main]
    paths:
      - 'partials/**'

permissions:
  contents: write

jobs:
  update-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update shared layout
        run: node scripts/update-layout.cjs
      - name: Verify shared layout
        run: node scripts/update-layout.cjs --check
      - name: Commit generated pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs blog
          git commit -m "Update shared layout"
          git push
